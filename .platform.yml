project: tasmil
component: ai
type: service
runtime: python
package_manager: poetry

test:
  command: poetry run pytest --cov=app --cov-report=json --cov-report=term-missing
  lint: poetry run ruff check .
  coverage_min: 70
  ai_review: true
  # The autonomous tester (FR-14-19). Read-only against staging and hard-bounded
  # by iterations, wall-clock and spend — whichever ceiling is hit first ends it.
  tester_agent:
    enabled: true
    scope:
      base_url_secret: TESTER_BASE_URL
      mutating: false
    slo:
      latency_p95_ms: 800
    soak:
      enabled: true
      iterations: 15
      budget_minutes: 8
      token_budget_usd: 2
      gate_on: [functional_high, latency_p95_slo]
    monitor:
      enabled: true
      schedule: "0 */6 * * *"
      target: staging

build:
  dockerfile: Dockerfile
  context: .

deploy:
  target: vm
  service: ai
  container_name: tasmil-ai
  compose_file: docker-compose.prod.yml
  health:
    path: /health
    port: 8000
  environments:
    staging:
      branch: deploy/staging
      url: https://ai.staging.tasmil.dev
    production:
      branch: deploy/prod
      url: https://ai.tasmil.dev

report:
  issues:
    repo: self
    auto_close_after_runs: 3
  lark:
    notify_on: [gate_block, new_high, auto_resolved]
  baselines:
    metric: p95
    drift_pct: 30
    sustained_runs: 2
