# Scheduled autonomous monitoring (FR-15). Generated from .platform.yml — the
# cron cannot be templated at run time, so it is written out here.
name: monitor

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  monitor:
    uses: devsecops-playground-org/platform/.github/workflows/tester-agent.yml@v1
    permissions:
      contents: read
      issues: write
    with:
      mode: monitor
      component: ai
      environment: staging
      base_url_secret: TESTER_BASE_URL
      slo_p95_ms: 800
      drift_pct: 30
      sustained_runs: 2
    # The dispatcher is this org's own pinned @v1 workflow, not a third party;
    # inheriting secrets to it is the intended design.
    secrets: inherit # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
